name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy already in flight is stale the moment a new commit lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Matcher tests
        run: npm test

      - name: Game loop tests (headless Chrome)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          for i in 1 2 3 4 5; do
            curl -sf http://localhost:8080/index.html >/dev/null && break
            sleep 1
          done
          out=""
          for attempt in 1 2 3; do
            out=$(google-chrome --headless --disable-gpu --no-sandbox \
              --virtual-time-budget=60000 --dump-dom \
              http://localhost:8080/tests/browser.test.html 2>/dev/null) || true
            title=$(printf '%s' "$out" | grep -o '<title>[^<]*</title>' | sed 's/<[^>]*>//g')
            echo "attempt $attempt: ${title:-no title}"
            case "$title" in
              PASS*)
                printf '%s' "$out" | sed -n '/<pre/,/<\/pre>/p' | sed 's/<[^>]*>//g'
                exit 0
                ;;
            esac
          done
          printf '%s' "$out" | sed -n '/<pre/,/<\/pre>/p' | sed 's/<[^>]*>//g'
          exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/

      - name: Stamp the cache version
        # The service worker only takes over when its own bytes change, and it
        # only drops stale files when its cache name changes. Without this, a
        # redeploy would leave every installed app on the version it first saw.
        run: |
          sed -i "s/^const VERSION = .*/const VERSION = 'say-it-${GITHUB_SHA::8}';/" _site/sw.js
          sed -i "s/^export const BUILD = .*/export const BUILD = '${GITHUB_SHA::8}';/" _site/js/version.js
          grep "const VERSION" _site/sw.js
          grep "BUILD" _site/js/version.js

      # No `enablement: true`: creating the Pages site is a repo-admin call,
      # and GITHUB_TOKEN is not a repo admin in an org — it answers 403
      # "Resource not accessible by integration" and takes the deploy with it.
      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
